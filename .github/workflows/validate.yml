name: Validate PrintLab

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/check-entry-budget.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: formforge-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  browsers:
    name: Browser regression (${{ matrix.shard }}/3)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @formforge/model
      # Every shard runs against the same validated artifact; never rebuild web here.
      - uses: actions/download-artifact@v4
        with:
          name: formforge-web-${{ github.sha }}
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ github.sha }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
